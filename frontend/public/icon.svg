<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.4"/>
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Dumbbell / Pulse vector -->
    <path d="M 60 120 L 60 180 A 30 30 0 0 0 90 210 L 90 90 A 30 30 0 0 0 60 120 Z" fill="url(#neonGrad)"/>
    <path d="M 240 120 L 240 180 A 30 30 0 0 1 210 210 L 210 90 A 30 30 0 0 1 240 120 Z" fill="url(#neonGrad)"/>
    <rect x="90" y="135" width="120" height="30" rx="10" fill="url(#neonGrad)"/>
    <!-- Central Pulse Wave -->
    <path d="M 110 150 L 130 150 L 140 120 L 155 180 L 165 135 L 175 160 L 190 150" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
